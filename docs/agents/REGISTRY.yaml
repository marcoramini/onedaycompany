schema_version: 1
updated: 2026-08-08

agents:
  - id: company-orchestrator
    name: Company Orchestrator
    type: governance
    lifecycle: definition
    priority: immediate
    documentation: docs/agents/company-orchestrator/README.md
    chat_starter: docs/agents/company-orchestrator/CHAT_STARTER.md
    owns:
      - work decomposition and routing
      - cross-agent dependency coordination
      - escalation of unresolved ownership conflicts
    must_not_own:
      - specialist artifacts
      - canonical company operational state
      - documentation semantics owned by other agents
    collaborates_with:
      - company-state
      - knowledge-documentation
      - governance-quality
      - website-agent
      - visual-asset-agent

  - id: company-state
    name: Company State Agent
    type: governance
    lifecycle: definition
    priority: immediate
    documentation: docs/agents/company-state/README.md
    chat_starter: docs/agents/company-state/CHAT_STARTER.md
    owns:
      - canonical operational-state model
      - state transition rules
      - state snapshots and provenance
    must_not_own:
      - strategic priorities
      - specialist artifact generation
      - publication approval
    collaborates_with:
      - company-orchestrator
      - knowledge-documentation
      - governance-quality
      - website-agent
      - visual-asset-agent

  - id: knowledge-documentation
    name: Knowledge & Documentation Agent
    type: governance
    lifecycle: definition
    priority: immediate
    documentation: docs/agents/knowledge-documentation/README.md
    chat_starter: docs/agents/knowledge-documentation/CHAT_STARTER.md
    owns:
      - documentation taxonomy and navigation
      - documentation consistency checks
      - knowledge freshness and handoff completeness
    must_not_own:
      - semantic decisions belonging to specialist agents
      - company strategy
      - runtime business state
    collaborates_with:
      - company-orchestrator
      - company-state
      - governance-quality
      - website-agent
      - visual-asset-agent

  - id: governance-quality
    name: Governance & Quality Agent
    type: governance
    lifecycle: definition
    priority: immediate
    documentation: docs/agents/governance-quality/README.md
    chat_starter: docs/agents/governance-quality/CHAT_STARTER.md
    owns:
      - agent-boundary and authority policy
      - acceptance and audit criteria
      - risk-based approval and escalation rules
    must_not_own:
      - implementation of specialist work
      - business strategy
      - final human approvals
    collaborates_with:
      - company-orchestrator
      - company-state
      - knowledge-documentation
      - website-agent
      - visual-asset-agent

  - id: company-foundation
    name: Company Foundation Agent
    type: domain
    lifecycle: definition
    priority: immediate
    implementation_order: 1
    documentation: docs/agents/company-foundation/README.md
    chat_starter: docs/agents/company-foundation/CHAT_STARTER.md
    owns:
      - company purpose, vision and mission semantics
      - initial company concept and foundational value proposition
      - impact proposals when accepted foundation elements change
    must_not_own:
      - first-offer detail and evolution
      - launch plan steps and activities
      - persistence or acceptance state
    collaborates_with:
      - company-orchestrator
      - company-state
      - knowledge-documentation
      - governance-quality
      - first-offer
      - launch-planning
      - workspace-generation-orchestrator

  - id: first-offer
    name: First Offer Agent
    type: domain
    lifecycle: definition
    priority: immediate
    implementation_order: 2
    documentation: docs/agents/first-offer/README.md
    chat_starter: docs/agents/first-offer/CHAT_STARTER.md
    owns:
      - first-offer promise, audience, scope and delivery semantics
      - offer boundaries and initial price hypothesis when appropriate
      - proposal of offer evolution and foundation impact warnings
    must_not_own:
      - company vision and mission
      - launch plan steps and activities
      - direct mutation of accepted foundation or company state
    collaborates_with:
      - company-foundation
      - company-state
      - knowledge-documentation
      - governance-quality
      - launch-planning
      - workspace-generation-orchestrator

  - id: launch-planning
    name: Launch Planning Agent
    type: domain
    lifecycle: definition
    priority: immediate
    implementation_order: 3
    documentation: docs/agents/launch-planning/README.md
    chat_starter: docs/agents/launch-planning/CHAT_STARTER.md
    owns:
      - company-specific implementation of universal capabilities
      - launch steps, activities and completion criteria semantics
      - realistic low-cost path from accepted foundation and offer to launch
    must_not_own:
      - universal capability identifiers
      - activity status, identifiers or timestamps
      - company foundation or first-offer semantics
    collaborates_with:
      - company-foundation
      - first-offer
      - company-state
      - knowledge-documentation
      - governance-quality
      - workspace-generation-orchestrator

  - id: workspace-generation-orchestrator
    name: Workspace Generation Orchestrator
    type: integration
    lifecycle: definition
    priority: immediate
    implementation_order: 4
    documentation: docs/agents/workspace-generation-orchestrator/README.md
    chat_starter: docs/agents/workspace-generation-orchestrator/CHAT_STARTER.md
    owns:
      - generation-stage orchestration and dependency execution
      - persisted progress, retry and partial-result lifecycle
      - workspace assembly and generation feedback contract
    must_not_own:
      - semantic generation rules of domain agents
      - silent acceptance of generated proposals
      - application-wide orchestration outside workspace generation
    collaborates_with:
      - company-foundation
      - first-offer
      - launch-planning
      - company-state
      - governance-quality
      - knowledge-documentation

  - id: website-agent
    name: Website Agent
    type: tool
    lifecycle: designed
    priority: immediate
    documentation: docs/tools/website-agent/README.md
    chat_starter: docs/agents/README.md#website-agent
    owns:
      - structured site documents and revisions
      - website preview and publication workflow
      - placement of approved visual assets
    must_not_own:
      - visual asset generation and storage
      - arbitrary application code generation
      - publication without explicit acceptance
    collaborates_with:
      - company-orchestrator
      - company-state
      - knowledge-documentation
      - governance-quality
      - visual-asset-agent

  - id: visual-asset-agent
    name: Visual Asset Agent
    type: tool
    lifecycle: active-design
    priority: immediate
    documentation: docs/tools/visual-asset-agent/README.md
    chat_starter: docs/agents/README.md#visual-asset-agent
    owns:
      - structured asset briefs and results
      - visual direction, variants and asset provenance
      - provider interaction and durable asset storage
    must_not_own:
      - placement in consumer outputs
      - website or campaign publication
      - business action requiring the asset
    collaborates_with:
      - company-orchestrator
      - company-state
      - knowledge-documentation
      - governance-quality
      - website-agent

planned_agents:
  - id: strategy-agent
    trigger: Separate when strategy workload can no longer be safely owned by the Company Orchestrator.
  - id: finance-agent
    trigger: Add when real budgets, transactions or financial reporting require a canonical owner and human approval model.
  - id: legal-compliance-agent
    trigger: Add when contracts, regulated data or jurisdiction-specific obligations require a canonical owner and mandatory human review.
  - id: promotion-agent
    trigger: Add before implementing the promotional-launch workflow as a durable tool.
  - id: customer-operations-agent
    trigger: Add when contact, booking, ordering, payment or follow-up becomes a bounded product capability.
